name: 🎬 Manga Recap Pipeline
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg espeak-ng
          pip install requests edge-tts kokoro soundfile numpy openai
      - name: Run Factory
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python panel_pipeline.py
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: manga-video
          path: workspace/clip_*.mp4
