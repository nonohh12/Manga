name: 🎬 Manga Recap Pipeline
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Environment & Tools
        run: |
          sudo apt-get update
          # Removed libasound2 and added espeak-ng/ffmpeg dependencies
          sudo apt-get install -y ffmpeg espeak-ng
          pip install requests edge-tts soundfile numpy openai

      - name: 🏭 Run Production Factory
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          mkdir -p workspace
          mkdir -p output
          python3 panel_pipeline.py

      - name: 📤 Download Final Recap Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Manga-Recap-Video
          path: output/Omniscient_Reader_Recap.mp4
